<script>
(function () {
'use strict';
var app = document.getElementById('app');
var SECRET = 'break-in-lock-it-down-m13-values-travel-as-dollar-one';
var SQLLIB = null, db = null;

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rand4() { var c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < 4; i++) { s += c[Math.floor(Math.random() * c.length)]; } return s; }
function fnv(s) { var h = 0xcbf29ce484222325n, p = 0x100000001b3n; for (var i = 0; i < s.length; i++) { h ^= BigInt(s.charCodeAt(i)); h = (h * p) & 0xffffffffffffffffn; } return h; }
function hashPassword(p) { return fnv('practice-salt|' + p).toString(16).padStart(16, '0'); }
function norm(c) { return String(c).toUpperCase().replace(/\s/g, '').replace(/O/g, '0').replace(/[IL]/g, '1'); }
function focusTop() { var h = app.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } window.scrollTo(0, 0); }

var FLAGS = { leak: 'LEAK-' + rand4(), login: 'ADMIN-' + rand4() };
var HIDDEN_IDS = [7, 8, 9];

/* ---------- the practice database ---------- */
function seed() {
  if (db) { db.close(); }
  db = new SQLLIB.Database();
  db.run(
    "CREATE TABLE feedback (id INTEGER PRIMARY KEY, lesson INTEGER NOT NULL, message TEXT NOT NULL, approved INTEGER NOT NULL, created_at TEXT NOT NULL);" +
    "CREATE TABLE users (id INTEGER PRIMARY KEY, username TEXT UNIQUE NOT NULL, password_hash TEXT NOT NULL, role TEXT NOT NULL);"
  );
  var fb = [
    [1, 3, 'The kitchen analogy finally made the event loop click for me.', 1, '2027-04-19 09:14'],
    [2, 5, 'Watching the uncaught error land in the error middleware was the best part.', 1, '2027-04-19 10:02'],
    [3, 3, 'I predicted setTimeout before setImmediate. Wrong, and now I know why.', 1, '2027-04-20 08:47'],
    [4, 6, 'Restarting the server and watching the count reset was a surprise.', 1, '2027-04-21 19:33'],
    [5, 4, 'Parallel finished first even though I clicked it second!', 1, '2027-04-21 20:05'],
    [6, 7, 'POST answering 201 with the new id makes a lot more sense now.', 1, '2027-04-22 11:41'],
    [7, 7, 'Spam: get 10,000 followers today at totally-real-followers.example', 0, '2027-04-22 13:09'],
    [8, 6, 'Please delete my earlier comment. I typed my phone number into it by mistake.', 0, '2027-04-22 15:26'],
    [9, 2, 'Instructor draft, not for students: answer notes for the lesson 2 demo. FLAG: ' + FLAGS.leak, 0, '2027-04-23 07:58']
  ];
  var st = db.prepare('INSERT INTO feedback VALUES ($1, $2, $3, $4, $5)');
  fb.forEach(function (r) { st.run(r); });
  st.free();
  var us = [[1, 'apc440-admin', hashPassword('k7#vQ2!mZp-not-guessable'), 'instructor'], [2, 'kmarsh', hashPassword('lesson7rocks'), 'student'], [3, 'tvega', hashPassword('EventLoop4ever'), 'student']];
  st = db.prepare('INSERT INTO users VALUES ($1, $2, $3, $4)');
  us.forEach(function (r) { st.run(r); });
  st.free();
}
function run(sql, values) {
  try {
    var st = db.prepare(sql);
    if (values) { st.bind(values); }
    var rows = [];
    while (st.step()) { rows.push(st.getAsObject()); }
    st.free();
    return { ok: true, rows: rows };
  } catch (e) { return { ok: false, error: e.message }; }
}

/* ---------- the server handlers (each one matches the code it shows) ---------- */
var LIST = {
  vuln: {
    code: "// GET /api/feedback?lesson=3   (feedback.js)\nexport async function listFeedback(req, res) {\n  const lesson = req.query.lesson;\n  const sql = `SELECT id, lesson, message FROM feedback\n               WHERE approved = 1 AND lesson = ${lesson}`;\n  const result = await query(sql);\n  res.json(result.rows);\n}",
    handle: function (lesson) { return sqlParts(['SELECT id, lesson, message FROM feedback WHERE approved = 1 AND lesson = ', { u: lesson }]); }
  },
  quotes: {
    label: 'Put quotes around the value',
    code: "export async function listFeedback(req, res) {\n  const lesson = req.query.lesson;\n  const sql = `SELECT id, lesson, message FROM feedback\n               WHERE approved = 1 AND lesson = '${lesson}'`;\n  const result = await query(sql);\n  res.json(result.rows);\n}",
    handle: function (lesson) { return sqlParts(['SELECT id, lesson, message FROM feedback WHERE approved = 1 AND lesson = \'', { u: lesson }, '\'']); },
    why: "Quotes stop <code>3 OR 1=1</code>, because now it is just a strange piece of text. But <code>3' OR '1'='1</code> brings its own quote, closes yours early, and gets through. The attacker only needed one more character."
  },
  escape: {
    label: 'Escape the quotes by hand',
    code: "export async function listFeedback(req, res) {\n  const lesson = req.query.lesson.replaceAll(\"'\", \"''\");\n  const sql = `SELECT id, lesson, message FROM feedback\n               WHERE approved = 1 AND lesson = ${lesson}`;\n  const result = await query(sql);\n  res.json(result.rows);\n}",
    handle: function (lesson) { return sqlParts(['SELECT id, lesson, message FROM feedback WHERE approved = 1 AND lesson = ', { u: lesson.replace(/'/g, "''") }]); },
    why: "Doubling quotes protects a value that sits inside quotes. This value does not. <code>3 OR 1=1</code> has no quotes to escape, so it still leaks every row."
  },
  fixed: {
    label: 'Validate, then send the value as $1',
    code: "export async function listFeedback(req, res) {\n  const lesson = Number(req.query.lesson);\n  if (!Number.isInteger(lesson) || lesson < 1 || lesson > 7) {\n    return res.status(400).json({ error: 'lesson must be a whole number from 1 to 7' });\n  }\n  const result = await query(\n    'SELECT id, lesson, message FROM feedback WHERE approved = 1 AND lesson = $1',\n    [lesson]\n  );\n  res.json(result.rows);\n}",
    handle: function (lesson) {
      var n = Number(lesson);
      if (String(lesson).trim() === '' || !Number.isInteger(n) || n < 1 || n > 7) { return { status: 400, body: { error: 'lesson must be a whole number from 1 to 7' }, sqlHtml: '(no query ran: validation answered first)', values: null }; }
      var r = run('SELECT id, lesson, message FROM feedback WHERE approved = 1 AND lesson = $1', [n]);
      return finish(r, esc('SELECT id, lesson, message FROM feedback WHERE approved = 1 AND lesson = $1'), [n]);
    },
    why: "The value travels separately, as <code>$1</code>, so the database never reads it as SQL. Validation turns away anything that is not a whole number before the query even runs."
  }
};
var LOGIN = {
  vuln: {
    code: "// POST /api/login   (auth.js)\nexport async function login(req, res) {\n  const { username, password } = req.body;\n  const hash = hashPassword(password);\n  const sql = `SELECT id, username, role FROM users\n               WHERE username = '${username}' AND password_hash = '${hash}'`;\n  const result = await query(sql);\n  if (result.rows.length === 0) {\n    return res.status(401).json({ error: 'Wrong username or password' });\n  }\n  res.json({ welcome: result.rows[0].username, role: result.rows[0].role });\n}",
    handle: function (u, p) { return loginParts(u, p); }
  },
  length: {
    label: 'Limit the length of both fields',
    code: "export async function login(req, res) {\n  const { username, password } = req.body;\n  if (username.length > 30 || password.length > 30) {\n    return res.status(400).json({ error: 'Too long' });\n  }\n  const hash = hashPassword(password);\n  const sql = `SELECT id, username, role FROM users\n               WHERE username = '${username}' AND password_hash = '${hash}'`;\n  // ... same as before\n}",
    handle: function (u, p) { if (u.length > 30 || p.length > 30) { return { status: 400, body: { error: 'Too long' }, sqlHtml: '(no query ran: validation answered first)', values: null }; } return loginParts(u, p); },
    why: "<code>' OR '1'='1' --</code> is only 15 characters. Length limits are a good habit, but they do not stop injection."
  },
  blockor: {
    label: 'Block any input that contains OR',
    code: "export async function login(req, res) {\n  const { username, password } = req.body;\n  if (/\\bor\\b/i.test(username) || /\\bor\\b/i.test(password)) {\n    return res.status(400).json({ error: 'That looks like an attack' });\n  }\n  const hash = hashPassword(password);\n  const sql = `SELECT id, username, role FROM users\n               WHERE username = '${username}' AND password_hash = '${hash}'`;\n  // ... same as before\n}",
    handle: function (u, p) { if (/\bor\b/i.test(u) || /\bor\b/i.test(p)) { return { status: 400, body: { error: 'That looks like an attack' }, sqlHtml: '(no query ran: validation answered first)', values: null }; } return loginParts(u, p); },
    why: "Blocking OR stops one attack, but <code>apc440-admin' --</code> needs no OR at all. A blocklist always misses something."
  },
  fixed: {
    label: 'Send both values as $1 and $2',
    code: "export async function login(req, res) {\n  const { username, password } = req.body;\n  const result = await query(\n    'SELECT id, username, role FROM users WHERE username = $1 AND password_hash = $2',\n    [username, hashPassword(password)]\n  );\n  if (result.rows.length === 0) {\n    return res.status(401).json({ error: 'Wrong username or password' });\n  }\n  res.json({ welcome: result.rows[0].username, role: result.rows[0].role });\n}",
    handle: function (u, p) {
      var vals = [u, hashPassword(p)];
      var r = run('SELECT id, username, role FROM users WHERE username = $1 AND password_hash = $2', vals);
      return loginFinish(r, esc('SELECT id, username, role FROM users WHERE username = $1 AND password_hash = $2'), vals);
    },
    why: "The username and the password hash travel as <code>$1</code> and <code>$2</code>. A quote in the username is just one more character in a value, never the end of a string."
  }
};
function sqlParts(parts) {
  var sql = '', html = '';
  parts.forEach(function (p) {
    if (typeof p === 'string') { sql += p; html += esc(p); }
    else { sql += p.u; html += '<mark class="inj"><span class="sr-only">[your input:] </span>' + esc(p.u) + '<span class="sr-only"> [end of your input]</span></mark>'; }
  });
  return finish(run(sql), html, null);
}
function finish(r, sqlHtml, values) {
  if (!r.ok) { return { status: 500, body: { error: 'Something went wrong on the server' }, terminal: 'Error: ' + r.error, sqlHtml: sqlHtml, values: values }; }
  return { status: 200, body: r.rows, sqlHtml: sqlHtml, values: values };
}
function loginParts(u, p) {
  var h = hashPassword(p);
  var sql = "SELECT id, username, role FROM users WHERE username = '" + u + "' AND password_hash = '" + h + "'";
  var html = esc("SELECT id, username, role FROM users WHERE username = '") + '<mark class="inj"><span class="sr-only">[your input:] </span>' + esc(u) + '<span class="sr-only"> [end of your input]</span></mark>' + esc("' AND password_hash = '" + h + "'");
  return loginFinish(run(sql), html, null);
}
function loginFinish(r, sqlHtml, values) {
  if (!r.ok) { return { status: 500, body: { error: 'Something went wrong on the server' }, terminal: 'Error: ' + r.error, sqlHtml: sqlHtml, values: values }; }
  if (r.rows.length === 0) { return { status: 401, body: { error: 'Wrong username or password' }, sqlHtml: sqlHtml, values: values }; }
  return { status: 200, body: { welcome: r.rows[0].username, role: r.rows[0].role }, sqlHtml: sqlHtml, values: values };
}
var STATUS_TEXT = { 200: 'OK', 400: 'Bad Request', 401: 'Unauthorized', 500: 'Internal Server Error' };
function responseHtml(res) {
  var h = '<span class="lbl">The SQL the server ran</span><pre aria-live="polite"><code>' + res.sqlHtml + (res.values ? '\n\nvalues: ' + esc(JSON.stringify(res.values)) : '') + '</code></pre>';
  h += '<span class="lbl">What the server sent back</span><pre class="demo-output"><code><span class="demo-status">HTTP ' + res.status + ' ' + STATUS_TEXT[res.status] + '</span>\n\n' + esc(JSON.stringify(res.body, null, 2)) + '</code></pre>';
  if (res.terminal) { h += '<span class="lbl">Your server terminal (only you see this)</span><pre class="term"><code>' + esc(res.terminal) + '</code></pre>'; }
  return h;
}
function codeBlock(file, code) { return '<span class="code-file">' + esc(file) + '</span><pre><code>' + esc(code) + '</code></pre>'; }
function leaked(res) { return res.status === 200 && Array.isArray(res.body) && res.body.some(function (r) { return HIDDEN_IDS.indexOf(r.id) >= 0; }); }

/* ---------- multiple choice ---------- */
function mcHtml(id, q) {
  var order = shuffle(q.o.map(function (o, i) { return i; }));
  return '<div class="q" id="' + id + '"><h3>' + q.q + '</h3><div class="opts">' + order.map(function (i) { return '<button class="opt" data-i="' + i + '">' + q.o[i] + '</button>'; }).join('') + '</div><div class="qfb" aria-live="polite"></div></div>';
}
function wireMc(id, q, onDone) {
  var box = document.getElementById(id), btns = box.querySelectorAll('.opt');
  btns.forEach(function (b) {
    b.onclick = function () {
      var i = +b.dataset.i, ok = i === 0;
      btns.forEach(function (x) {
        x.disabled = true; var xi = +x.dataset.i;
        if (xi === 0) { x.classList.add('right'); x.insertAdjacentHTML('beforeend', '<span class="why">Correct answer</span>'); }
        else if (xi === i) { x.classList.add('wrong'); x.insertAdjacentHTML('beforeend', '<span class="why">Your answer</span>'); }
      });
      box.querySelector('.qfb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><strong class="' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Correct.' : 'Not quite.') + '</strong> ' + q.e + '</div>';
      onDone(ok);
    };
  });
}

/* ---------- state ---------- */
var STATIONS = [
  { name: 'Recon: read the query', topic: 'How your input becomes SQL' },
  { name: 'The leak', topic: 'OR 1=1 on the lesson filter' },
  { name: 'The login bypass', topic: "' OR '1'='1' -- on the instructor login" },
  { name: 'Lock it down', topic: 'Fix both handlers, then prove it' },
  { name: 'Spot the hole', topic: 'Safe or unsafe, including AI-written code' }
];
var G = { best: [null, null, null, null, null], name: '', payloads: { leak: null, login: null } };
function overall() { var played = G.best.filter(function (b) { return b !== null; }); return Math.round(G.best.reduce(function (a, b) { return a + (b || 0); }, 0) / STATIONS.length); }
function saveScore(i, pct) { pct = Math.max(0, Math.min(100, Math.round(pct))); if (G.best[i] === null || pct > G.best[i]) { G.best[i] = pct; } return pct; }

/* ---------- home ---------- */
function home() {
  var played = G.best.some(function (b) { return b !== null; });
  app.innerHTML =
    '<span class="pill">Module 13 &bull; Show What You Know</span><h1>Break In, Lock It Down</h1>' +
    '<p class="lead">This is a practice copy of your Learn Node on Node site, with a real database running inside this tab. First you break in with SQL injection. Then you lock it down, the same way your Lab 13 code already does.</p>' +
    '<section class="note" aria-labelledby="eth"><h2 id="eth" style="color:#6b3600;font-size:1.1rem;margin:0 0 .25rem">Attack only what you own</h2><p style="margin:0">Use these skills only on sites you own or have written permission to test. Trying them on anyone else&rsquo;s site is illegal. Everything here is a practice copy built to be broken.</p></section>' +
    '<p>Work the five stations in order. Replay any station as often as you like: your <strong>best percent at each station is kept</strong> until you reload this page.</p>' +
    '<div class="tiles">' + STATIONS.map(function (s, i) {
      var b = G.best[i];
      return '<button class="tile" data-go="' + i + '"><span class="nm">' + (i + 1) + '. ' + esc(s.name) + '</span><span class="tp">' + esc(s.topic) + '</span><span class="sc' + (b === 100 ? ' full' : '') + '">' + (b === null ? 'Not played yet' : 'Best: ' + b + '%' + (b === 100 ? ' (perfect)' : '')) + '</span></button>';
    }).join('') + '</div>' +
    '<section class="sun" aria-labelledby="sf"><h2 id="sf">Your results so far</h2><p style="margin:0 0 .5rem"><strong>Overall: ' + overall() + '%</strong>, the average of all five stations. A station you have not played counts as 0%.</p>' +
    '<label for="nm">Your name, as it appears in Canvas</label><input type="text" id="nm" autocomplete="name"><p class="err" id="nmerr" role="alert"></p>' +
    '<button id="cert"' + (played ? '' : ' disabled') + '>Download my certificate</button>' +
    '<p style="margin:.75rem 0 0">Upload the certificate image to the Canvas assignment. Your results reset if you reload this page, so download it before you leave.</p></section>';
  app.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { STATION_FN[+b.dataset.go](); }; });
  var nm = document.getElementById('nm'); nm.value = G.name; nm.oninput = function () { G.name = nm.value; document.getElementById('nmerr').textContent = ''; };
  document.getElementById('cert').onclick = certificate;
  focusTop();
}
function stationHead(i) { return '<span class="pill">Station ' + (i + 1) + ' of 5</span><h1>' + esc(STATIONS[i].name) + '</h1>'; }
function finishBar(i) { return '<div class="row" style="margin-top:1.25rem"><button id="finish" disabled>Finish this station</button><button class="btn-alt" id="back">Back to the missions</button></div><p id="finishnote" class="prog" aria-live="polite"></p>'; }
function wireBack() { document.getElementById('back').onclick = home; }

  { ai: false, safe: false, code: "export async function login(req, res) {\n  const { username, password } = req.body;\n  if (username.length > 30) {\n    return res.status(400).json({ error: 'Too long' });\n  }\n  const result = await query(\n    `SELECT * FROM users WHERE username = '${username}'`\n  );\n  // ... check the password hash\n}", e: 'The length check is fine, but the username is still pasted inside quotes. <code>apc440-admin\' --</code> is only 16 characters.' }
];
function stationSpot() {
  var ai = shuffle(SNIPS.filter(function (s) { return s.ai; }))[0];
  var rest = shuffle(SNIPS.filter(function (s) { return s !== ai && !s.ai; })).slice(0, 5);
  var set = shuffle([ai].concat(rest)), answered = 0, right = 0;
  app.innerHTML = stationHead(4) +
    '<p class="lead">Six snippets of Express and pg code. Decide whether each one is safe from SQL injection. At least one was written by an AI assistant that says it is fine. Your first answer to each one counts.</p>' +
    set.map(function (s, k) {

    }).join('') + finishBar(4);
  set.forEach(function (s, k) {
    var box = document.getElementById('sp' + k), btns = box.querySelectorAll('.opt');
    btns.forEach(function (b) {

        var said = b.dataset.a === 'safe', ok = said === s.safe;

        answered++;
        btns.forEach(function (x) {

          if (isAns) { x.classList.add('right'); x.insertAdjacentHTML('beforeend', '<span class="why">Correct answer</span>'); }
          else if (x === b) { x.classList.add('wrong'); x.insertAdjacentHTML('beforeend', '<span class="why">Your answer</span>'); }
        });
        box.querySelector('.qfb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><strong class="' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Correct.' : 'Not quite.') + ' This code is ' + (s.safe ? 'SAFE' : 'UNSAFE') + '.</strong> ' + s.e + '</div>';
        if (answered === set.length) { document.getElementById('finish').disabled = false; document.getElementById('finishnote').textContent = 'All six answered. Finish when you are ready.'; }
      };
    });
  });
  document.getElementById('finish').onclick = function () { done(4, right / set.length * 100, right + ' of 6 snippets judged correctly.'); };
  wireBack(); focusTop();
}

/* ---------- certificate and verify ---------- */

  var a = document.createElement('a'); a.download = 'APC440-M13-Break-In-Lock-It-Down-' + name.replace(/[^a-z0-9]+/gi, '-') + '.png'; a.href = c.toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();

}
function verify() {
  app.innerHTML = '<h1>Instructor check</h1><p>Type the values exactly as they appear on the certificate image.</p>' +
    '<label for="v-n">Name</label><input type="text" id="v-n">' +
    STATIONS.map(function (s, i) { return '<label for="v-' + i + '">' + (i + 1) + '. ' + esc(s.name) + ' (percent, 0 to 100)</label><input type="number" id="v-' + i + '" min="0" max="100">'; }).join('') +
    '<label for="v-s">Saved (for example 2027-04-26 09:05)</label><input type="text" id="v-s"><label for="v-c">Code</label><input type="text" id="v-c">' +
    '<p style="margin-top:12px"><button id="v-go">Check</button></p><p id="v-out" role="status" style="font-weight:700;font-size:1.2rem"></p>';

}
